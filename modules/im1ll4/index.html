<style>
  /* sayac-cam — Glassmorphism: derinlik ve ışık katmanı; düz renk bant ya da kart yerine yarı saydam yüzeyler. */
  .modulex-sayac-cam { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-sayac-cam *, .modulex-sayac-cam *::before, .modulex-sayac-cam *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-sayac-cam :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-sayac-cam :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-sayac-cam :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-sayac-cam :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-sayac-cam img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-sayac-cam) img { height: auto; }
  .modulex-sayac-cam [hidden] { display: none !important; }
  .modulex-sayac-cam :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-sayac-cam :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-sayac-cam-ic { max-width: --max--; margin-inline: auto; }
  .modulex-sayac-cam-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-sayac-cam--bassiz .modulex-sayac-cam-bas { display: none; }
  .modulex-sayac-cam-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-sayac-cam-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-sayac-cam-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-sayac-cam-bas { max-width: 780px; margin-inline: auto; text-align: center; justify-items: center; }
  .modulex-sayac-cam-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-sayac-cam-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-sayac-cam-dugme:hover { transform: translateY(-2px); }
  .modulex-sayac-cam-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-sayac-cam-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-sayac-cam-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-sayac-cam-ag { position: relative; padding: clamp(24px, 4vw, 48px); overflow: hidden; border-radius: calc(--yuvarlak-- * 1.5); background: color-mix(in srgb, --accent-- 8%, --bg--); isolation: isolate; }
  .modulex-sayac-cam-leke { position: absolute; z-index: -1; width: 46%; aspect-ratio: 1; border-radius: 50%; filter: blur(60px); opacity: 0.55; animation: modulex-sayac-cam-yuz 14s ease-in-out infinite alternate; }
  .modulex-sayac-cam-leke--1 { inset-block-start: -18%; inset-inline-start: -8%; background: --accent--; }
  .modulex-sayac-cam-leke--2 { inset-block-end: -24%; inset-inline-end: -6%; background: color-mix(in srgb, --accent-- 45%, --text--); animation-duration: 18s; }
  .modulex-sayac-cam-liste { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 16px; }
  .modulex-sayac-cam-cam { display: grid; gap: 6px; padding: 26px; border: 1px solid color-mix(in srgb, --bg-- 70%, transparent); border-radius: --yuvarlak--; background: color-mix(in srgb, --bg-- 72%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 20px 40px -30px color-mix(in srgb, --text-- 50%, transparent); transition: transform 0.3s ease; }
  .modulex-sayac-cam-cam:hover { transform: translateY(-4px); }
  .modulex-sayac-cam-ikon { color: --accentInk--; font-size: 28px; }
  .modulex-sayac-cam-sayi { font-size: clamp(2.2rem, 3.6vw, 2.9rem); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .modulex-sayac-cam-ek { color: --accentInk--; font-size: 0.55em; }
  .modulex-sayac-cam-etiket { font-size: 1.02rem; font-weight: 700; }
  .modulex-sayac-cam-not { color: --muted--; font-size: 0.9rem; }
  @keyframes modulex-sayac-cam-yuz { from { transform: translate(0, 0) scale(1); } to { transform: translate(12%, 10%) scale(1.15); } }
  @media (max-width: 768px) {
    .modulex-sayac-cam-liste { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .modulex-sayac-cam-cam { padding: 16px; }
  }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-cam :is(.modulex-sayac-cam-baslik, .modulex-sayac-cam-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-cam-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-sayac-cam { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-sayac-cam *, .modulex-sayac-cam *::before, .modulex-sayac-cam *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-sayac-cam";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const sayac = (s, P, az) => {
        const el = [...s.querySelectorAll("[data-hedef]")];
        if (!el.length || az || !("IntersectionObserver" in window)) return;
        const dl = document.documentElement.lang || undefined;
        const oynat = () => el.forEach((e) => {
          const h = Number(e.dataset.hedef);
          const od = Number(e.dataset.ondalik) || 0;
          const son = e.textContent;
          if (!Number.isFinite(h)) return;
          let f;
          try { f = new Intl.NumberFormat(dl, { minimumFractionDigits: od, maximumFractionDigits: od }); } catch (x) { return; }
          const t0 = performance.now();
          const adim = (t) => {
            const p = Math.min(1, (t - t0) / 1300);
            e.textContent = p < 1 ? f.format(h * (1 - Math.pow(1 - p, 3))) : son;
            if (p < 1) requestAnimationFrame(adim);
          };
          requestAnimationFrame(adim);
        });
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { oynat(); io.disconnect(); } });
        }, { threshold: 0.3 });
        io.observe(s);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      sayac(s, P, az);
    });
  })();
</script>
